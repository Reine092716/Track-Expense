<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple 15-Day Budget Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-full text-slate-800 antialiased p-4 sm:p-6 max-w-xl mx-auto">

    <!-- Header -->
    <header class="text-center mb-6">
        <h1 class="text-2xl font-bold text-slate-900 flex items-center justify-center gap-2">
            <i class="fa-solid fa-wallet text-blue-600"></i> 15-Day Budget Tracker
        </h1>
        <p class="text-xs text-slate-500 mt-1">Track your semi-monthly salary & expenses easily</p>
    </header>

    <!-- 15-Day Salary Card -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-4">
        <label for="incomeInput" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">
            15-Day Salary / Income ($)
        </label>
        <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 font-bold">$</span>
            <input type="number" id="incomeInput" placeholder="0.00" step="0.01" min="0"
                class="w-full pl-8 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-base font-semibold focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
    </section>

    <!-- Summary Metrics -->
    <section class="grid grid-cols-3 gap-3 mb-6">
        <div class="bg-emerald-50 p-3 rounded-2xl border border-emerald-100 text-center">
            <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-700">Income</span>
            <div id="metricIncome" class="text-base font-extrabold text-emerald-700 mt-0.5">$0.00</div>
        </div>
        <div class="bg-rose-50 p-3 rounded-2xl border border-rose-100 text-center">
            <span class="text-[10px] font-bold uppercase tracking-wider text-rose-700">Spent</span>
            <div id="metricExpenses" class="text-base font-extrabold text-rose-700 mt-0.5">$0.00</div>
        </div>
        <div class="bg-blue-50 p-3 rounded-2xl border border-blue-100 text-center">
            <span class="text-[10px] font-bold uppercase tracking-wider text-blue-700">Left</span>
            <div id="metricBalance" class="text-base font-extrabold text-blue-700 mt-0.5">$0.00</div>
        </div>
    </section>

    <!-- Action Bar: Export Excel & Save Period -->
    <section class="flex gap-2 mb-6">
        <button id="exportExcelBtn" class="flex-1 py-2.5 px-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs rounded-xl shadow-sm flex items-center justify-center gap-1.5 transition">
            <i class="fa-solid fa-file-excel text-sm"></i> Export Excel (.csv)
        </button>
        <button id="archivePeriodBtn" class="flex-1 py-2.5 px-3 bg-slate-800 hover:bg-slate-900 text-white font-semibold text-xs rounded-xl shadow-sm flex items-center justify-center gap-1.5 transition">
            <i class="fa-solid fa-box-archive text-sm"></i> Close & Save Period
        </button>
    </section>

    <!-- Add Expense Form -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6">
        <h2 class="text-sm font-bold text-slate-900 mb-3 flex items-center gap-1.5">
            <i class="fa-solid fa-plus-circle text-blue-600"></i> Add Expense
        </h2>
        <form id="expenseForm" class="space-y-3">
            <div>
                <input type="text" id="expDesc" placeholder="Description (e.g. Groceries)" required
                    class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <input type="number" id="expAmt" placeholder="Amount ($)" step="0.01" min="0.01" required
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <select id="expCat" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="Groceries">🛒 Groceries</option>
                        <option value="Bills">📱 Bills</option>
                        <option value="Personal">🎉 Personal</option>
                        <option value="Savings">💰 Savings</option>
                        <option value="Others">📦 Others</option>
                    </select>
                </div>
            </div>

            <div>
                <input type="date" id="expDate" required
                    class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-xl shadow-sm active:scale-[0.99] transition-transform">
                Add Expense
            </button>
        </form>
    </section>

    <!-- Expense List -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-bold text-slate-900 flex items-center gap-1.5">
                <i class="fa-solid fa-list-check text-blue-600"></i> Recent Expenses
            </h2>
            <button id="clearAllBtn" class="text-xs text-rose-600 font-semibold hover:underline">Clear All</button>
        </div>

        <ul id="expenseList" class="space-y-2">
            <!-- Dynamic expense rows -->
        </ul>

        <p id="emptyState" class="text-xs text-slate-400 text-center py-6 hidden">No expenses added for this 15-day period yet.</p>
    </section>

    <!-- Past Records / History Section -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mt-6">
        <h2 class="text-sm font-bold text-slate-900 mb-3 flex items-center gap-1.5">
            <i class="fa-solid fa-clock-rotate-left text-blue-600"></i> Past 15-Day Records
        </h2>
        
        <ul id="historyList" class="space-y-3">
            <!-- Dynamic past periods -->
        </ul>
        <p id="emptyHistory" class="text-xs text-slate-400 text-center py-4">No archived period records yet.</p>
    </section>

    <script>
        // App State
        let income = 0;
        let expenses = [];
        let historyRecords = [];

        // DOM Cache
        const incomeInput = document.getElementById('incomeInput');
        const metricIncome = document.getElementById('metricIncome');
        const metricExpenses = document.getElementById('metricExpenses');
        const metricBalance = document.getElementById('metricBalance');
        const expenseForm = document.getElementById('expenseForm');
        const expDesc = document.getElementById('expDesc');
        const expAmt = document.getElementById('expAmt');
        const expCat = document.getElementById('expCat');
        const expDate = document.getElementById('expDate');
        const expenseList = document.getElementById('expenseList');
        const emptyState = document.getElementById('emptyState');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const exportExcelBtn = document.getElementById('exportExcelBtn');
        const archivePeriodBtn = document.getElementById('archivePeriodBtn');
        const historyList = document.getElementById('historyList');
        const emptyHistory = document.getElementById('emptyHistory');

        // Init App
        window.addEventListener('DOMContentLoaded', () => {
            expDate.valueAsDate = new Date();
            loadStorage();
            render();

            incomeInput.addEventListener('input', (e) => {
                income = parseFloat(e.target.value) || 0;
                saveStorage();
                renderMetrics();
            });

            expenseForm.addEventListener('submit', (e) => {
                e.preventDefault();
                expenses.unshift({
                    id: Date.now().toString(),
                    desc: expDesc.value.trim(),
                    amount: parseFloat(expAmt.value),
                    category: expCat.value,
                    date: expDate.value
                });
                expDesc.value = '';
                expAmt.value = '';
                expDesc.focus();
                saveStorage();
                render();
            });

            clearAllBtn.addEventListener('click', () => {
                if (expenses.length > 0 && confirm('Clear all current expenses?')) {
                    expenses = [];
                    saveStorage();
                    render();
                }
            });

            exportExcelBtn.addEventListener('click', () => {
                exportToExcel(income, expenses, 'Current_15Day_Budget');
            });

            archivePeriodBtn.addEventListener('click', () => {
                if (expenses.length === 0 && income === 0) {
                    alert('Please enter income or expenses before archiving this period.');
                    return;
                }
                const periodLabel = prompt('Enter a name or date range for this 15-day period (e.g. Nov 1 - 15, 2026):', getSuggestedPeriodName());
                if (!periodLabel) return;

                const totalSpent = expenses.reduce((s, item) => s + item.amount, 0);
                historyRecords.unshift({
                    id: Date.now().toString(),
                    title: periodLabel,
                    archivedAt: new Date().toLocaleDateString(),
                    income: income,
                    totalSpent: totalSpent,
                    balance: income - totalSpent,
                    expenses: [...expenses]
                });

                // Reset current period
                income = 0;
                expenses = [];
                incomeInput.value = '';
                saveStorage();
                render();
            });
        });

        function getSuggestedPeriodName() {
            const today = new Date();
            const day = today.getDate();
            const monthStr = today.toLocaleString('default', { month: 'short' });
            if (day <= 15) {
                return `${monthStr} 1 - 15, ${today.getFullYear()}`;
            } else {
                const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
                return `${monthStr} 16 - ${lastDay}, ${today.getFullYear()}`;
            }
        }

        function render() {
            renderMetrics();
            renderList();
            renderHistory();
        }

        function renderMetrics() {
            const totalSpent = expenses.reduce((sum, item) => sum + item.amount, 0);
            const balance = income - totalSpent;

            metricIncome.textContent = `$${income.toFixed(2)}`;
            metricExpenses.textContent = `$${totalSpent.toFixed(2)}`;
            metricBalance.textContent = `$${balance.toFixed(2)}`;

            if (balance < 0) {
                metricBalance.className = "text-base font-extrabold text-rose-600 mt-0.5";
            } else {
                metricBalance.className = "text-base font-extrabold text-blue-700 mt-0.5";
            }
        }

        function renderList() {
            expenseList.innerHTML = '';
            if (expenses.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            expenses.forEach(item => {
                const li = document.createElement('li');
                li.className = "flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-100 text-xs";
                li.innerHTML = `
                    <div class="min-w-0 flex-1 pr-2">
                        <div class="font-bold text-slate-800 truncate">${escapeHtml(item.desc)}</div>
                        <div class="text-[10px] text-slate-400 mt-0.5">${item.category} • ${item.date}</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-extrabold text-slate-900">-$${item.amount.toFixed(2)}</span>
                        <button onclick="deleteExpense('${item.id}')" class="text-slate-400 hover:text-rose-600 p-1">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                expenseList.appendChild(li);
            });
        }

        function renderHistory() {
            historyList.innerHTML = '';
            if (historyRecords.length === 0) {
                emptyHistory.classList.remove('hidden');
                return;
            }
            emptyHistory.classList.add('hidden');

            historyRecords.forEach(rec => {
                const li = document.createElement('li');
                li.className = "p-3 bg-slate-50 rounded-xl border border-slate-200 text-xs space-y-2";
                li.innerHTML = `
                    <div class="flex items-center justify-between font-bold text-slate-900">
                        <span>${escapeHtml(rec.title)}</span>
                        <span class="${rec.balance >= 0 ? 'text-emerald-700' : 'text-rose-600'}">
                            Left: $${rec.balance.toFixed(2)}
                        </span>
                    </div>
                    <div class="flex justify-between text-[11px] text-slate-500">
                        <span>Income: $${rec.income.toFixed(2)}</span>
                        <span>Spent: $${rec.totalSpent.toFixed(2)}</span>
                        <span>Items: ${rec.expenses.length}</span>
                    </div>
                    <div class="flex items-center justify-end gap-2 pt-1 border-t border-slate-200">
                        <button onclick="exportHistoryExcel('${rec.id}')" class="text-emerald-700 hover:text-emerald-800 font-semibold text-[11px] flex items-center gap-1">
                            <i class="fa-solid fa-file-excel"></i> Export
                        </button>
                        <button onclick="deleteHistoryRecord('${rec.id}')" class="text-rose-600 hover:text-rose-700 font-semibold text-[11px] flex items-center gap-1">
                            <i class="fa-solid fa-trash-can"></i> Delete
                        </button>
                    </div>
                `;
                historyList.appendChild(li);
            });
        }

        function deleteExpense(id) {
            expenses = expenses.filter(e => e.id !== id);
            saveStorage();
            render();
        }

        function deleteHistoryRecord(id) {
            if (confirm('Delete this historical period record?')) {
                historyRecords = historyRecords.filter(r => r.id !== id);
                saveStorage();
                renderHistory();
            }
        }

        function exportHistoryExcel(id) {
            const rec = historyRecords.find(r => r.id === id);
            if (rec) {
                const filename = rec.title.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                exportToExcel(rec.income, rec.expenses, filename);
            }
        }

        function exportToExcel(incomeVal, expenseArr, filename) {
            const totalSpent = expenseArr.reduce((s, i) => s + i.amount, 0);
            const balance = incomeVal - totalSpent;

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "15-DAY BUDGET SUMMARY\n";
            csvContent += `Income,$${incomeVal.toFixed(2)}\n`;
            csvContent += `Total Spent,$${totalSpent.toFixed(2)}\n`;
            csvContent += `Remaining Balance,$${balance.toFixed(2)}\n\n`;

            csvContent += "EXPENSE DETAILS\n";
            csvContent += "Date,Category,Description,Amount ($)\n";

            expenseArr.forEach(exp => {
                const descEscaped = `"${exp.desc.replace(/"/g, '""')}"`;
                csvContent += `${exp.date},${exp.category},${descEscaped},${exp.amount.toFixed(2)}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `${filename}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function saveStorage() {
            localStorage.setItem('simple_15day_income', income);
            localStorage.setItem('simple_15day_expenses', JSON.stringify(expenses));
            localStorage.setItem('simple_15day_history', JSON.stringify(historyRecords));
        }

        function loadStorage() {
            income = parseFloat(localStorage.getItem('simple_15day_income')) || 0;
            incomeInput.value = income > 0 ? income : '';
            const savedExp = localStorage.getItem('simple_15day_expenses');
            if (savedExp) {
                try { expenses = JSON.parse(savedExp); } catch(e) {}
            }
            const savedHist = localStorage.getItem('simple_15day_history');
            if (savedHist) {
                try { historyRecords = JSON.parse(savedHist); } catch(e) {}
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }
    </script>
</body>
</html>
